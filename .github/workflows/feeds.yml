name: Fetch hotlists

"on":
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 24
      - name: Check script syntax
        run: node --check scripts/fetch-feeds.js
      - name: Show repo files
        run: find . -maxdepth 3 -type f -not -path './.git/*' | sort
      - name: Fetch feeds
        run: node scripts/fetch-feeds.js
      - name: Commit changes
        uses: stefanzweifel/git-auto-commit-action@v7
        with:
          commit_message: "chore: update hotlists"
          file_pattern: data/
