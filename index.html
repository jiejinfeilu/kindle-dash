<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=1072">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<title>Kindle 信息仪表盘</title>
<style>
  html, body {
    margin: 0;
    padding: 0;
    background: #ffffff;
    color: #000000;
  }
  body {
    width: 1072px;
    font-family: "Helvetica Neue", Helvetica, Arial, "PingFang SC", "Microsoft YaHei", sans-serif;
  }
  table.grid {
    width: 100%;
    border-collapse: collapse;
    table-layout: fixed;
  }
  td.cell {
    width: 50%;
    vertical-align: top;
  }
  .panel {
    border: 2px solid #000;
    margin: 8px 10px;
    padding: 8px 14px 12px;
    border-radius: 16px;
  }
  .panel h2 {
    font-size: 28px;
    margin: 0 0 6px;
    padding-bottom: 4px;
    border-bottom: 2px solid #000;
  }
  .fold-btn {
    float: right;
    font-size: 18px;
    padding: 3px 12px;
    margin-top: 2px;
    border: 1px solid #666;
    border-radius: 10px;
    background: #fff;
  }
  .p-body {
    font-size: 26px;
    line-height: 1.4;
  }

  .clock-panel {
    border: 3px dashed #000;
    border-radius: 30px;
    margin: 10px;
    padding: 14px 20px 12px;
    text-align: center;
    background: #f4f4f4;
  }
  .clock-time {
    font-size: 102px;
    font-weight: bold;
    letter-spacing: 4px;
    line-height: 1.1;
  }
  .clock-sec {
    font-size: 44px;
    letter-spacing: 2px;
  }
  .clock-date {
    font-size: 34px;
    margin-top: 2px;
  }
  .clock-greet {
    font-size: 26px;
    margin-top: 2px;
  }

  .w-main {
    font-size: 38px;
    font-weight: bold;
  }
  .w-sub {
    font-size: 24px;
    color: #333;
    margin-top: 2px;
  }
  .w-fc {
    font-size: 23px;
    line-height: 1.5;
    margin-top: 6px;
    white-space: pre-line;
  }

  .cat {
    font-size: 24px;
    font-weight: bold;
    margin-top: 6px;
  }
  .news-item {
    font-size: 22px;
    line-height: 1.25;
    padding: 2px 0 2px 8px;
    border-left: 3px solid #666;
    margin: 3px 0;
  }

  table.t {
    width: 100%;
    border-collapse: collapse;
    font-size: 24px;
  }
  table.t td {
    padding: 4px 2px;
    border-bottom: 1px solid #ccc;
  }
  table.t tr:last-child td {
    border-bottom: none;
  }
  .td-r {
    text-align: right;
  }
  .up { color: #000; }
  .down { color: #000; }

  .count-item {
    font-size: 26px;
    padding: 5px 0;
    border-bottom: 1px solid #ccc;
  }
  .count-item:last-child {
    border-bottom: none;
  }
  .count-days {
    font-size: 32px;
    font-weight: bold;
  }

  .todo-item {
    font-size: 25px;
    padding: 4px 0;
  }
  .todo-item input {
    width: 24px;
    height: 24px;
  }
  .todo-done {
    text-decoration: line-through;
    color: #666;
  }
  .bar {
    font-size: 22px;
    letter-spacing: 1px;
    margin-top: 6px;
  }

  .quote-box {
    font-size: 30px;
    text-align: center;
    line-height: 1.45;
    padding: 14px 10px;
  }

  img.wall {
    width: 100%;
    max-height: 220px;
    border: 1px solid #999;
  }
  .wall-cap {
    font-size: 21px;
    color: #333;
    margin-top: 3px;
  }

  .footer {
    font-size: 21px;
    color: #333;
    text-align: center;
    padding: 6px 20px 14px;
    border-top: 1px solid #999;
    margin-top: 8px;
  }
  .err {
    color: #333;
    font-size: 22px;
  }
  .tip {
    font-size: 20px;
    color: #444;
  }
  button {
    font-size: 24px;
    margin: 4px 4px 4px 0;
    padding: 4px 12px;
  }
  .edit-row {
    font-size: 24px;
    margin: 6px 0;
  }
  .edit-row input {
    font-size: 24px;
    width: 250px;
  }
  .edit-row input.d {
    width: 180px;
  }
  .edit-row input.cb {
    width: auto;
  }

  /* ===== v8 排版美化 ===== */
  body {
    padding: 0 0 10px;
  }
  .clock-panel {
    margin: 10px 12px 4px;
    border-color: #333;
    background: #f7f7f7;
  }
  .clock-date {
    font-size: 32px;
    color: #111;
  }
  .clock-greet {
    font-size: 24px;
    color: #444;
  }
  table.grid {
    border-collapse: separate;
    border-spacing: 10px 8px;
  }
  td.cell {
    padding: 0;
  }
  .panel {
    margin: 0;
    border: 1px solid #bbb;
    border-radius: 14px;
    padding: 10px 14px 12px;
    min-height: 240px;
  }
  .panel h2 {
    font-size: 24px;
    margin: 0 0 8px;
    padding: 2px 0 6px 10px;
    border-left: 5px solid #000;
    border-bottom: 1px solid #ddd;
    letter-spacing: 2px;
  }
  .p-body {
    font-size: 25px;
    line-height: 1.45;
  }
  .w-main {
    font-size: 36px;
  }
  .w-sub {
    font-size: 23px;
    color: #333;
  }
  .w-fc {
    font-size: 22px;
  }
  .cat {
    font-size: 22px;
    font-weight: bold;
    margin-top: 8px;
    background: #f0f0f0;
    padding: 2px 8px;
    display: inline-block;
  }
  .news-item {
    font-size: 22px;
    border-left: 3px solid #999;
    padding: 2px 8px;
    margin: 3px 0;
  }
  table.t {
    font-size: 23px;
  }
  table.t td {
    padding: 5px 6px;
    border-bottom: 1px solid #e0e0e0;
  }
  table.t tr:nth-child(even) td {
    background: #f5f5f5;
  }
  .count-item {
    font-size: 25px;
    padding: 5px 0;
    border-bottom: 1px solid #e0e0e0;
  }
  .count-days {
    font-size: 30px;
  }
  .todo-item {
    font-size: 24px;
    padding: 4px 0;
  }
  .bar {
    font-size: 21px;
  }
  .quote-box {
    font-size: 28px;
    padding: 12px 8px;
  }
  img.wall {
    border: 1px solid #ccc;
    border-radius: 8px;
  }
  .footer {
    font-size: 20px;
    color: #666;
    border-top: 1px solid #ddd;
    margin: 4px 12px 0;
  }
  button {
    font-size: 22px;
    padding: 3px 10px;
    border: 1px solid #888;
    background: #fff;
    border-radius: 8px;
  }
  .edit-row {
    font-size: 23px;
  }
  .edit-row input {
    font-size: 22px;
    width: 230px;
    border: 1px solid #aaa;
    padding: 2px 4px;
  }
  .tip {
    font-size: 19px;
    color: #555;
  }
  .err {
    font-size: 20px;
  }

  /* ===== v9 屏保风格：黑框 + 等宽数字时钟 + 醒目面板 ===== */
  body {
    border: 8px solid #000;
    padding: 0;
  }
  .clock-panel {
    margin: 0 0 6px;
    border: none;
    border-bottom: 6px double #000;
    background: #fff;
    padding: 16px 24px 12px;
  }
  .clock-time {
    font-family: "Consolas", "Courier New", monospace;
    font-size: 118px;
    letter-spacing: 2px;
  }
  .clock-sec {
    font-family: "Consolas", "Courier New", monospace;
    font-size: 34px;
    background: #000;
    color: #fff;
    padding: 2px 10px;
    border-radius: 6px;
    letter-spacing: 0;
  }
  .clock-date {
    font-size: 30px;
    color: #000;
  }
  .clock-greet {
    font-size: 22px;
    color: #555;
  }
  table.grid {
    border-spacing: 10px;
  }
  .panel {
    margin: 0;
    border: 1px solid #000;
    border-top: 5px solid #000;
    border-radius: 0;
    padding: 12px 16px;
    min-height: 230px;
  }
  .panel h2 {
    font-size: 26px;
    letter-spacing: 3px;
    border-left: none;
    border-bottom: 2px solid #000;
    padding: 0 0 6px 2px;
  }
  .p-body {
    font-size: 24px;
  }
  .w-main {
    font-size: 36px;
  }
  .cat {
    background: #eee;
    border-left: 4px solid #000;
  }
  .news-item {
    border-left: 3px solid #000;
  }
  table.t tr:nth-child(even) td {
    background: #f0f0f0;
  }
  .footer {
    border-top: 2px solid #000;
    margin: 6px 10px 0;
    font-size: 19px;
  }
  button {
    border: 1px solid #000;
    border-radius: 4px;
  }
  img.wall {
    border: 1px solid #000;
    border-radius: 0;
  }

  /* ===== v17 紧凑一屏模式（适配 Kindle 1072x1448 整屏显示） ===== */
  body {
    border-width: 6px;
  }
  .clock-panel {
    padding: 8px 18px 6px;
    border-bottom-width: 4px;
  }
  .clock-time {
    font-size: 86px;
  }
  .clock-sec {
    font-size: 26px;
    padding: 1px 8px;
  }
  .clock-date {
    font-size: 24px;
  }
  .clock-greet {
    font-size: 18px;
  }
  table.grid {
    border-spacing: 8px;
  }
  .panel {
    padding: 8px 12px 10px;
    min-height: 170px;
  }
  .panel h2 {
    font-size: 22px;
    padding: 0 0 4px 8px;
    margin-bottom: 5px;
  }
  .p-body {
    font-size: 20px;
    line-height: 1.35;
  }
  .w-main {
    font-size: 30px;
  }
  .w-sub {
    font-size: 19px;
  }
  .w-fc {
    font-size: 18px;
    line-height: 1.35;
  }
  .cat {
    font-size: 18px;
    padding: 1px 6px;
    margin-top: 5px;
  }
  .news-item {
    font-size: 18px;
    padding: 1px 6px;
    margin: 2px 0;
  }
  table.t {
    font-size: 19px;
  }
  table.t td {
    padding: 3px 5px;
  }
  .count-item {
    font-size: 20px;
    padding: 3px 0;
  }
  .count-days {
    font-size: 24px;
  }
  .todo-item {
    font-size: 19px;
    padding: 2px 0;
  }
  .bar {
    font-size: 17px;
  }
  .quote-box {
    font-size: 22px;
    padding: 8px 4px;
  }
  img.wall {
    max-height: 150px;
  }
  .wall-cap {
    font-size: 16px;
  }
  .footer {
    font-size: 16px;
    padding: 4px 12px 8px;
  }
  button {
    font-size: 18px;
    padding: 2px 8px;
  }

  /* ===== v20 页面全屏模式（伪全屏）：隐藏页面自己的底栏和标题 ===== */
  .fs-exit {
    display: none;
    position: fixed;
    top: 4px;
    right: 4px;
    z-index: 999;
    font-size: 20px;
    padding: 6px 12px;
    border: 1px solid #888;
    border-radius: 12px;
    background: #fff;
  }
  .fs .fs-exit {
    display: block;
  }
  .fs .footer,
  .fs #editPanel {
    display: none !important;
  }
  .fs .panel h2 {
    display: none;
  }
  .fs .panel {
    border: none;
    margin: 2px 4px;
    padding: 2px 8px;
  }
  .edit-row {
    font-size: 19px;
  }
  .edit-row input {
    font-size: 18px;
    width: 200px;
  }
  .tip {
    font-size: 15px;
  }
  .err {
    font-size: 16px;
  }

  /* ===== v18 自适应宽度：浏览器视口多宽就铺多宽 ===== */
  html, body {
    box-sizing: border-box;
  }
  body {
    width: 100%;
    max-width: 1072px;
    margin: 0 auto;
  }
</style>
</head>
<body>

<div id="clockBox"></div>
<div id="grid"></div>

<div id="editPanel" class="panel" style="display:none">
  <h2>编辑倒计时与待办</h2>
  <div class="w-sub">倒计时（日期格式 YYYY-MM-DD）</div>
  <div id="editCount"></div>
  <button onclick="addCnt()">+ 添加倒计时</button>
  <div class="w-sub" style="margin-top:8px">待办事项</div>
  <div id="editTodo"></div>
  <button onclick="addTodo()">+ 添加待办</button>
  <div style="margin-top:10px">
    <button onclick="saveEdits()">保存</button>
    <button onclick="resetEdits()">恢复默认</button>
    <button onclick="toggleEdit(false)">取消</button>
  </div>
  <div class="tip">保存后只在这台设备的浏览器里生效；清除浏览器缓存会恢复成文件里的配置。</div>
  <div id="syncStatus" class="tip"></div>
</div>

<div class="footer">
  缩放 <button onclick="zoomPage(-1)">−</button><span id="zoomLv">100%</span><button onclick="zoomPage(1)">+</button><button onclick="zoomReset()">100%</button> ｜ 版本 <span id="appVer">--</span> ｜ 上次更新 <span id="lastUpdate">--</span> ｜ 下次刷新 <span id="countdown">--</span> ｜ <span id="cloudStatus"></span> <button onclick="toggleFs()">全屏</button> <button id="editBtn" onclick="toggleEdit()">编辑</button>
</div>

<button id="fsExit" class="fs-exit" onclick="toggleFs(false)">✦ 退出全屏</button>

<script>
/* ================================================================
   一、配置区（改这里即可，不需要动下面的代码）
   ================================================================ */
var APP_VERSION = "v20-20260811";  // 页面版本号，上传后用来判断网页是否已更新

var CONFIG = {
  refreshMs: 30 * 60 * 1000,   // 整页刷新间隔
  clockMs: 1000,               // 时钟更新间隔（省电可改 10000）

  /* --- 天气 ---
     weatherApi 三选一：
     "openmeteo"  ：Open-Meteo，完全免费、无需注册和 Key（默认，推荐）
     "openweather"：OpenWeather（免费 Key；建议 openweatherUseProxy 保持 true，国内才能访问）
     "qweather"   ：和风天气（免费个人版需实名认证，可选）
     openmeteo 用经纬度定位：温州 27.99,120.70；上海 31.23,121.47；北京 39.90,116.41。 */
  city: "温州",
  weatherApi: "openmeteo",
  openWeatherKey: "2d7dcdbd0ea58767e1e21a69234f8c2d",
  openweatherUseProxy: true,
  weatherLat: "27.99",
  weatherLon: "120.70",
  qweatherKey: "",
  qweatherLocation: "101210701",

  /* --- CORS 代理列表：按顺序逐个尝试，哪个通就用哪个 ---
     国内网络下 allorigins 可能不通，可自行把能用的代理加进来。 */
  proxies: [
    "https://api.allorigins.win/raw?url=",
    "https://corsproxy.io/?url=",
    "https://api.codetabs.com/v1/proxy?quest="
  ],

  /* --- 股市大盘行情（东方财富直连，国内稳定；失败自动切腾讯）---
     支持 A 股、港股、美股指数：
     上证指数 sh000001 / 深证成指 sz399001 / 创业板指 sz399006 /
     恒生指数 hkHSI / 纳斯达克 usIXIC / 道琼斯 usDJI */
  stocks: [
    { name: "上证指数", code: "sh000001" },
    { name: "深证成指", code: "sz399001" },
    { name: "创业板指", code: "sz399006" },
    { name: "恒生指数", code: "hkHSI" }
  ],

  /* --- 国内内容源 ---
     feeds 里每一项：
     type "rss"  -> 任意 RSS 地址（用 rss 字段）
     type "json" -> 接口返回 JSON，listPath 写数组路径，titleKey 写标题字段
     下面两个可选源填了才会显示：
     bilibiliUids：B站UP主 UID 列表，可填多个，显示各UP主最近动态
     xiaohongshuRssUrl：小红书没有公开接口，若你以后自建了 RSSHub
        并配置了小红书 Cookie，可把生成的 RSS 地址填在这里 */
  feeds: [
    { name: "B站热搜", type: "json",
      count: 4,
      sources: [
        { url: "https://api-hot.imsyy.top/bilibili", listPath: "data", titleKey: "title" },
        { url: "https://tenapi.cn/v2/bilihot", listPath: "data", titleKey: "title" },
        { url: "https://api.bilibili.com/x/web-interface/search/square?limit=10", listPath: "data.trending.list", titleKey: "keyword" }
      ] },
    { name: "知乎热榜", type: "json",
      count: 4,
      sources: [
        { url: "https://api-hot.imsyy.top/zhihu", listPath: "data", titleKey: "title" },
        { url: "https://tenapi.cn/v2/zhihuhot", listPath: "data", titleKey: "title" },
        { url: "https://api.vvhan.com/api/hotlist/zhihuHot", listPath: "data", titleKey: "title" }
      ] },
    { name: "微博热搜", type: "json",
      count: 4,
      sources: [
        { url: "https://api-hot.imsyy.top/weibo", listPath: "data", titleKey: "title" },
        { url: "https://tenapi.cn/v2/weibohot", listPath: "data", titleKey: "title" },
        { url: "https://api.vvhan.com/api/hotlist/wbHot", listPath: "data", titleKey: "title" }
      ] }
  ],
  /* --- B站UP主动态：可填多个 ---
     每项一行：{ name: "显示名字", uid: "UP主UID" }
     UID 获取：B站网页打开UP主主页，地址栏 space.bilibili.com/ 后面的数字。
     例如：{ name: "哔哩哔哩官方", uid: "2" } */
  bilibiliUids: [
    { name: "极客湾Geekerwan", uid: "25876945" },
    { name: "谈三圈", uid: "520814591" },
    { name: "一网一匠", uid: "383814461" },
    { name: "FUN科技", uid: "9321359" },
    // { name: "大小马聊科技", uid: "把UID数字填这里" }
  ],
  xiaohongshuRssUrl: "",        // 留空即可；自建 RSSHub 后再填
  rsshubs: [                    // B站UP主动态 RSS 服务列表，按顺序自动切换
    "https://rsshub.app",
    "https://rsshub.rssforever.com",
    "https://rsshub.pseudoyu.com"
  ],

  /* --- DeepSeek API 余额 ---
     apiKey：你的 DeepSeek API Key（注意：公开网页里填 Key 有泄露风险，见 README）
     单价：按 DeepSeek 官网最新价填（元/百万 tokens）。
       2026-08 官方预告新价：V4-Flash 输入 1 / 输出 2；
       V4-Pro 输入 3 / 输出 6（缓存命中更便宜）。
     manualBalance：自动查询被浏览器拦截时，手动填余额（元）兜底。 */
  deepseek: {
    apiKey: "sk-9d40e6541ca24570b9b9bf801529f147",
    priceInPerM: 1,
    priceOutPerM: 2,
    manualBalance: ""
  },

  /* --- 重要倒计时：date 格式 YYYY-MM-DD --- */
  countdowns: [
    { name: "金鹏伟结婚",   date: "2026-10-03" },
    { name: "春节",   date: "2027-02-17" },
    { name: "双十一", date: "2026-11-11" }
  ],

  /* --- 待办事项（勾选状态会自动保存） --- */
  todos: [
    { text: "部署新版仪表盘", done: false },
    { text: "填写 OpenWeather API Key", done: false },
    { text: "填写 B站UP主 UID", done: false }
  ],

  /* --- 多设备云端同步（可选，无需注册）---
     jsonblob：免费 JSON 云存储，不用注册、不用 Key。
     已内置固定 blobId，所有设备共用它同步：编辑 → 保存 即写入云端，
     打开页面自动读取。若保存时底部显示“云端同步失败”，说明当前网络
     访问不了 jsonblob，跳过即可（编辑仍保存在本机浏览器）。 */
  jsonblob: {
    blobId: ""
  },

  /* --- GitHub Gist 同步（推荐，国内可访问，用你已有的 GitHub 账号）---
     1) 打开 https://gist.github.com 新建 Gist，文件名填 kindle-dash.json，
        内容随便填 {"countdowns":[],"todos":[]}，点创建
     2) 复制网址里的 Gist ID（gist.github.com/你的用户名/后面那串）
     3) GitHub → Settings → Developer settings → Personal access tokens →
        Tokens (classic) → Generate new token → 只勾选 gist 权限 → 复制 token
     4) 填到下面。填了 github 就优先用它同步，jsonblob 作备选。 */
  github: {
    gistId: "",

/* ================================================================
   三、工具函数
   ================================================================ */
function $(id) { return document.getElementById(id); }

function pad(n) { return (n < 10 ? "0" : "") + n; }

function esc(s) {
  return String(s).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
}

function escAttr(s) {
  return esc(s).replace(/"/g, "&quot;");
}

function xhrGet(url, done) {
  var xhr = new XMLHttpRequest();
  xhr.open("GET", url, true);
  xhr.timeout = 12000;
  xhr.onreadystatechange = function () {
    if (xhr.readyState === 4) {
      if (xhr.status >= 200 && xhr.status < 300) { done(null, xhr.responseText); }
      else { done(new Error("HTTP " + xhr.status)); }
    }
  };
  xhr.ontimeout = function () { done(new Error("timeout")); };
  xhr.onerror = function () { done(new Error("network")); };
  xhr.send();
}

function jsonGet(url, done) {
  xhrGet(url, function (err, txt) {
    if (err) { done(err); return; }
    try { done(null, JSON.parse(txt)); }
    catch (e) { done(e); }
  });
}

function fetchViaProxies(url, done) {
  var proxies = CONFIG.proxies || [];
  var idx = 0;
  function next() {
    if (idx >= proxies.length) { done(new Error("所有代理都失败")); return; }
    var p = proxies[idx++];
    xhrGet(p + encodeURIComponent(url), function (err, txt) {
      if (err) { next(); return; }
      done(null, txt);
    });
  }
  next();
}

function jsonViaProxies(url, done) {
  fetchViaProxies(url, function (err, txt) {
    if (err) { done(err); return; }
    try { done(null, JSON.parse(txt)); }
    catch (e) { done(e); }
  });
}

function jsonGetSmart(url, done) {
  if (CONFIG.openweatherUseProxy) { jsonViaProxies(url, done); }
  else { jsonGet(url, done); }
}

function decodeEntities(s) {
  return s
    .replace(/&amp;/g, "&")
    .replace(/&lt;/g, "<")
    .replace(/&gt;/g, ">")
    .replace(/&quot;/g, "\"")
    .replace(/&#39;/g, "'")
    .replace(/&nbsp;/g, " ");
}

function getPath(obj, path) {
  var parts = path.split(".");
  var cur = obj;
  for (var i = 0; i < parts.length; i++) {
    if (!cur) { return null; }
    cur = cur[parts[i]];
  }
  return cur;
}

function formatNum(n) {
  if (n === undefined || n === null || isNaN(n)) { return "--"; }
  var s = Math.round(n).toString();
  var out = "";
  for (var i = 0; i < s.length; i++) {
    out += s[i];
    var fromRight = s.length - 1 - i;
    if (fromRight > 0 && fromRight % 3 === 0) { out += ","; }
  }
  return out;
}

function setBody(id, html) {
  var el = $("mod-" + id);
  if (el) { el.innerHTML = html; }
}

function panelHtml(id, title, body) {
  return '<div class="panel">' +
         '<h2>' + esc(title) +

}

/* --- 模块收起/展开（状态保存在本机，刷新后仍保持） --- */
var LS_FOLD = "kindle_dash_folded_v1";

function readFold() {
  try { return JSON.parse(localStorage.getItem(LS_FOLD) || "{}"); }
  catch (e) { return {}; }
}

function writeFold(o) {
  try { localStorage.setItem(LS_FOLD, JSON.stringify(o)); } catch (e) {}
}

function isFolded(id) {
  return !!readFold()[id];
}

function toggleModule(id) {
  var o = readFold();
  o[id] = !o[id];
  writeFold(o);
  var w = $("pw-" + id);
  var b = $("fold-" + id);
  if (w) { w.style.display = o[id] ? "none" : ""; }
  if (b) { b.textContent = o[id] ? "展开" : "收起"; }
}

function applyModuleState(id) {
  var w = $("pw-" + id);
  var b = $("fold-" + id);
  if (!w) { return; }
  var folded = isFolded(id);
  w.style.display = folded ? "none" : "";
  if (b) { b.textContent = folded ? "展开" : "收起"; }
}

        if (fcEl) { fcEl.textContent = "（三天预报加载失败）"; }

      var order = [];

        var dsc = (it.weather && it.weather[0]) ? it.weather[0].description : "";
        if (!dd) {
          days[dt] = { min: tmin, max: tmax, desc: dsc };
          order.push(dt);
        } else {
          dd.min = Math.min(dd.min, tmin);
          dd.max = Math.max(dd.max, tmax);
          if (!dd.desc && dsc) { dd.desc = dsc; }
        }
      }
      var names = ["今天", "明天", "后天"];
      var lines = [];
      for (var j = 0; j < Math.min(3, order.length); j++) {

        lines.push(names[j] + "：" + (day.desc || "") + " " + Math.round(day.min) + "~" + Math.round(day.max) + "°C");
      }
      if (fcEl) { fcEl.textContent = lines.join("\n"); }
    });
  });

function wmoText(code) {
  if (code === 0) { return "晴"; }
  if (code === 1) { return "多云"; }
  if (code === 2 || code === 3) { return "阴"; }
  if (code === 45 || code === 48) { return "雾"; }
  if (code === 51 || code === 53 || code === 55) { return "毛毛雨"; }
  if (code === 56 || code === 57 || code === 66 || code === 67) { return "冻雨"; }
  if (code === 61 || code === 63 || code === 65) { return "雨"; }
  if (code === 71 || code === 73 || code === 75 || code === 77) { return "雪"; }
  if (code === 80 || code === 81 || code === 82) { return "阵雨"; }
  if (code === 85 || code === 86) { return "阵雪"; }
  if (code >= 95) { return "雷雨"; }
  return "未知";
}

/* --- 国内内容源 --- */
function parseRss(xmlText) {
  var items = [];
  var re = /<item>([\s\S]*?)<\/item>/g;
  var mm;
  while ((mm = re.exec(xmlText)) !== null) { items.push(mm[1]); }
  var out = [];
  for (var i = 0; i < items.length && out.length < 5; i++) {
    var t = items[i].match(/<title>(.*?)<\/title>/);
    if (t && t[1]) {
      var title = decodeEntities(t[1].replace(/<!\[CDATA\[|\]\]>/g, "")).replace(/\s+/g, " ").trim();
      if (title) { out.push(title); }
    }
  }
  return out;
}

function fetchBiliTitles(feed, cb) {
  var hubs = CONFIG.rsshubs || [];
  var hi = 0;
  function next() {
    if (hi >= hubs.length) { cb(null, []); return; }
    var u = hubs[hi++] + "/bilibili/user/dynamic/" + feed.uid;
    fetchViaProxies(u, function (err, txt) {
      if (err || !txt) { next(); return; }
      var titles = parseRss(txt);
      if (titles.length) { cb(null, titles); }
      else { next(); }
    });
  }
  next();
}

function feedTitles(feed, cb) {
  if (feed.type === "bili") { fetchBiliTitles(feed, cb); return; }
  if (feed.type === "rss") {
    xhrGet(feed.url, function (err, txt) {
      if (err || !txt) {
        fetchViaProxies(feed.url, function (err2, txt2) {
          if (err2 || !txt2) { cb(null, []); return; }
          cb(null, parseRss(txt2));
        });
        return;
      }
      cb(null, parseRss(txt));
    });
  } else if (feed.type === "json") {
    var sources = feed.sources || [{ url: feed.url, listPath: feed.listPath, titleKey: feed.titleKey }];
    var si = 0;
    function nextSrc() {
      if (si >= sources.length) { cb(null, []); return; }
      var src = sources[si++];
      jsonGet(src.url, function (err, data) {
        if (err || !data) {
          jsonViaProxies(src.url, function (err2, data2) {
            if (err2 || !data2) { nextSrc(); return; }
            var titles = extractTitles(src, data2, feed.count);
            if (titles.length) { cb(null, titles); } else { nextSrc(); }
          });
          return;
        }
        var titles = extractTitles(src, data, feed.count);
        if (titles.length) { cb(null, titles); } else { nextSrc(); }
      });
    }
    nextSrc();
  } else {
    cb(null, []);
  }
}

function extractTitles(src, data, limit) {
  var arr = getPath(data, src.listPath);
  if (!arr || !arr.length) { return []; }
  var out = [];
  var max = limit || 3;
  for (var i = 0; i < arr.length && out.length < max; i++) {
    var title = getPath(arr[i], src.titleKey);
    if (title) { out.push(String(title).trim()); }
  }
  return out;
}

  }
  if (!feeds.length) {
    setBody("feeds", '<div class="err">请在 CONFIG.feeds 添加内容源</div>');
    return;
  }
  var results = [];
  var done = 0;
  function finishAll() {
    var html = "";
    var anyOk = false;
    for (var i = 0; i < feeds.length; i++) {
      var titles = results[i] || [];
      html += '<div class="cat">' + esc(feeds[i].name) + '</div>';
      if (!titles.length) {
        html += '<div class="news-item">（暂无内容或加载失败）</div>';
      } else {
        anyOk = true;
        var limit = Math.min(titles.length, feeds[i].count || 3);
        for (var j = 0; j < limit; j++) {
          html += '<div class="news-item">' + esc(titles[j]) + '</div>';
        }
      }
    }
    if (!anyOk) {
      html += '<div class="tip">（所有内容源当前均不可达：可在配置 proxies 中添加可用的代理地址）</div>';
    }
    setBody("feeds", html);
  }
  for (var k = 0; k < feeds.length; k++) {
    (function (idx) {
      feedTitles(feeds[idx], function (err, titles) {
        results[idx] = titles || [];
        done++;
        if (done >= feeds.length) { finishAll(); }
      });
    })(k);
  }
}

/* --- 股市大盘：东方财富直连（国内）优先，失败自动切腾讯代理 --- */
function emSecid(code) {
  if (code === "sh000001") { return "1.000001"; }
  if (code === "sz399001") { return "0.399001"; }
  if (code === "sz399006") { return "0.399006"; }
  if (code === "hkHSI") { return "100.HSI"; }
  if (code === "usIXIC") { return "100.NDX"; }
  if (code === "usDJI") { return "100.DJI"; }
  if (code === "usINX") { return "100.SPX"; }
  return "";
}

function stockTable(list, rows) {
  var html = '<table class="t">';
  var count = 0;
  for (var i = 0; i < list.length; i++) {
    var r = rows[i];
    if (!r || r.price === undefined || r.price === null || isNaN(r.price)) { continue; }
    var pct = r.pct || 0;
    var arrow = pct >= 0 ? "↑" : "↓";
    html += '<tr><td>' + esc(list[i].name) + '</td><td class="td-r">' + Number(r.price).toFixed(2) +
            '</td><td class="td-r">' + arrow + ' ' + Math.abs(pct).toFixed(2) + '%</td></tr>';
    count++;
  }
  html += '</table>';
  return { html: html, count: count };
}

function showStockMock() {
  var mh = "";
  for (var j = 0; j < MOCK.stock.length; j++) {
    mh += '<tr><td>' + esc(MOCK.stock[j].name) + '</td><td class="td-r">' + MOCK.stock[j].price + '</td><td class="td-r">' + MOCK.stock[j].pct + '</td></tr>';
  }
  setBody("stock", '<table class="t">' + mh + '</table><div class="tip">（行情接口暂不可达，显示模拟数据）</div>');
}

function renderStockTencent(list) {
  var codes = [];
  for (var i = 0; i < list.length; i++) { codes.push(list[i].code); }
  fetchViaProxies("https://qt.gtimg.cn/q=" + codes.join(","), function (err, txt) {
    if (err || !txt) { showStockMock(); return; }
    var rows = [];
    for (var k = 0; k < list.length; k++) {
      var mm2 = txt.match(new RegExp("v_" + list[k].code + '="([^"]*)"'));
      if (!mm2) { rows.push(null); continue; }
      var f = mm2[1].split("~");
      var price = parseFloat(f[3]);
      var prev = parseFloat(f[4]);
      if (!isFinite(price) || !isFinite(prev) || !prev) { rows.push(null); continue; }
      rows.push({ price: price, pct: (price - prev) / prev * 100 });
    }
    var out = stockTable(list, rows);
    if (out.count) { setBody("stock", out.html); }
    else { showStockMock(); }
  });
}

function renderStock() {
  var list = CONFIG.stocks;
  if (!list.length) { setBody("stock", '<div class="err">请在 CONFIG.stocks 添加指数</div>'); return; }
  var secids = [];
  for (var i = 0; i < list.length; i++) {
    var s = emSecid(list[i].code);
    if (s) { secids.push(s); }
  }
  if (secids.length) {
    var url = "https://push2.eastmoney.com/api/qt/ulist.np/get?secids=" + secids.join(",") +
              "&fields=f2,f3,f12,f14,f18&fltt=2&invt=2&np=1";
    jsonGet(url, function (err, d) {
      if (!err && d && d.data && d.data.diff && d.data.diff.length) {
        var diff = d.data.diff;
        var rows = [];
        for (var j = 0; j < list.length; j++) { rows.push(diff[j] || null); }
        var out = stockTable(list, rows);
        if (out.count) { setBody("stock", out.html); return; }
      }
      renderStockTencent(list);
    });
    return;
  }
  renderStockTencent(list);
}

/* --- 多设备同步（jsonblob，无需注册，国内一般可访问） --- */
function jbId() {
  var c = CONFIG.jsonblob;
  return (c && c.blobId) ? String(c.blobId).trim() : "";
}

function jbRequest(method, url, body, done) {
  var xhr = new XMLHttpRequest();
  xhr.open(method, url, true);
  if (body) { xhr.setRequestHeader("Content-Type", "application/json"); }
  xhr.timeout = 15000;
  xhr.onreadystatechange = function () {
    if (xhr.readyState === 4) {
      if (xhr.status >= 200 && xhr.status < 300) { done(null, xhr); }
      else { done(new Error("HTTP " + xhr.status)); }
    }
  };
  xhr.ontimeout = function () { done(new Error("timeout")); };
  xhr.onerror = function () { done(new Error("network")); };
  xhr.send(body || null);
}

function ghPush(cb) {
  var g = CONFIG.github;
  var gid = String(g.gistId).trim();
  var tok = String(g.token).trim();
  var content = JSON.stringify({ countdowns: loadCountdowns(), todos: loadTodos() });
  var body = JSON.stringify({ files: { "kindle-dash.json": { content: content } } });
  var xhr = new XMLHttpRequest();
  xhr.open("PATCH", "https://api.github.com/gists/" + gid, true);
  xhr.setRequestHeader("Authorization", "token " + tok);
  xhr.setRequestHeader("Accept", "application/vnd.github+json");
  xhr.setRequestHeader("Content-Type", "application/json");
  xhr.timeout = 15000;
  xhr.onreadystatechange = function () {
    if (xhr.readyState === 4) {
      if (xhr.status >= 200 && xhr.status < 300) { cb(null, "已同步云端(GitHub)"); }
      else { cb(new Error("HTTP " + xhr.status)); }
    }
  };
  xhr.ontimeout = function () { cb(new Error("timeout")); };
  xhr.onerror = function () { cb(new Error("network")); };
  xhr.send(body);
}

function ghPull(cb) {
  var g = CONFIG.github;
  var gid = String(g.gistId).trim();
  var tok = String(g.token).trim();
  var xhr = new XMLHttpRequest();
  xhr.open("GET", "https://api.github.com/gists/" + gid, true);
  if (tok) { xhr.setRequestHeader("Authorization", "token " + tok); }
  xhr.setRequestHeader("Accept", "application/vnd.github+json");
  xhr.timeout = 15000;
  xhr.onreadystatechange = function () {
    if (xhr.readyState !== 4) { return; }
    if (xhr.status >= 200 && xhr.status < 300) {
      try {
        var d = JSON.parse(xhr.responseText);
        var f = d.files && d.files["kindle-dash.json"];
        if (f && f.content) {
          var rec = JSON.parse(f.content);
          if (rec.countdowns && rec.countdowns.length) { saveCountdowns(rec.countdowns); }
          if (rec.todos && rec.todos.length) { saveTodos(rec.todos); }
          cb(null, "已从云端同步(GitHub)");
        } else { cb(null, ""); }
      } catch (e) { cb(e); }
    } else { cb(new Error("HTTP " + xhr.status)); }
  };
  xhr.ontimeout = function () { cb(new Error("timeout")); };
  xhr.onerror = function () { cb(new Error("network")); };
  xhr.send();
}

function cloudPush(cb) {
  var g = CONFIG.github;
  if (g && g.gistId && g.token) { ghPush(cb); return; }
  var id = jbId();
  if (!id) { cb(null, ""); return; }
  var body = JSON.stringify({ countdowns: loadCountdowns(), todos: loadTodos() });
  jbRequest("PUT", "https://jsonblob.com/api/jsonBlob/" + id, body, function (err) {
    if (err) { cb(err); return; }
    cb(null, "已同步云端");
  });
}

function cloudPull(cb) {
  var g = CONFIG.github;
  if (g && g.gistId) { ghPull(cb); return; }
  var id = jbId();
  if (!id) { cb(null, ""); return; }
  jbRequest("GET", "https://jsonblob.com/api/jsonBlob/" + id, null, function (err, xhr) {
    if (err) { cb(err); return; }
    try {
      var rec = JSON.parse(xhr.responseText);
      if (rec.countdowns && rec.countdowns.length) { saveCountdowns(rec.countdowns); }
      if (rec.todos && rec.todos.length) { saveTodos(rec.todos); }
      cb(null, "已从云端同步");
    } catch (e) { cb(e); }
  });
}

function showCloud(msg) {
  var st = $("cloudStatus");
  if (st) { st.textContent = msg || ""; }
  var sp = $("syncStatus");
  if (sp) { sp.textContent = msg || ""; }
}

}, CONFIG.refreshMs);

/* ================================================================
   七、缩放控制（Kindle 浏览器不能双指缩放时的备用方案）
   ================================================================ */
var ZOOM = 100;
var ZOOM_USE_CSS = null;

function zoomSupported() {
  try {
    var el = document.createElement("div");
    el.style.zoom = "2";
    document.body.appendChild(el);
    var v = window.getComputedStyle ? window.getComputedStyle(el).zoom : "";
    document.body.removeChild(el);
    return !!v && v !== "" && v !== "normal";
  } catch (e) {
    return false;
  }
}

function applyZoom(z) {
  ZOOM = z;
  if (ZOOM_USE_CSS === null) { ZOOM_USE_CSS = zoomSupported(); }
  var b = document.body;
  if (ZOOM_USE_CSS) {
    /* 老版 WebKit 内核优先用 CSS zoom（会真正重排页面，缩放后不剩空白） */
    b.style.zoom = z + "%";
    b.style.webkitTransform = "";
    b.style.transform = "";
    b.style.webkitTransformOrigin = "";
    b.style.transformOrigin = "";
  } else {
    /* 不支持 zoom 时退化为 transform 缩放 */
    b.style.zoom = "";
    b.style.webkitTransform = "scale(" + (z / 100) + ")";
    b.style.transform = "scale(" + (z / 100) + ")";
    b.style.webkitTransformOrigin = "top center";
    b.style.transformOrigin = "top center";
  }
  var lv = $("zoomLv");
  if (lv) { lv.textContent = z + "%"; }
  try { localStorage.setItem("kindle_dash_zoom", String(z)); } catch (e) {}
}

function zoomPage(dir) {
  var z = (ZOOM || 100) + dir * 10;
  if (z < 60) { z = 60; }
  if (z > 200) { z = 200; }
  applyZoom(z);
}

function zoomReset() {
  applyZoom(100);
}

/* ================================================================
   七之二、页面全屏模式（伪全屏）
   说明：Kindle 自带的网址栏是系统界面，网页无法隐藏。
   这里的“全屏”是隐藏页面自己的底栏、编辑按钮和模块标题，
   让内容占满整屏，看起来更像屏保。退出按钮会出现在右上角。
   ================================================================ */
function toggleFs(on) {
  var fs = (on === undefined) ? !(document.body.className.indexOf("fs") >= 0) : !!on;
  if (fs) {
    var de = document.documentElement;
    if (de.requestFullscreen) { try { de.requestFullscreen(); } catch (e) {} }
    else if (de.webkitRequestFullscreen) { try { de.webkitRequestFullscreen(); } catch (e) {} }
  } else {
    if (document.exitFullscreen) { try { document.exitFullscreen(); } catch (e) {} }
    else if (document.webkitExitFullscreen) { try { document.webkitExitFullscreen(); } catch (e) {} }
  }
  document.body.className = fs ? "fs" : "";
  try { localStorage.setItem("kindle_dash_fs", fs ? "1" : "0"); } catch (e) {}
}

/* ================================================================
   八、初始化
   ================================================================ */
function init() {
  var now = new Date();
  $("lastUpdate").textContent = pad(now.getHours()) + ":" + pad(now.getMinutes());
  var v = $("appVer");
  if (v) { v.textContent = APP_VERSION; }
  try {
    if (localStorage.getItem("kindle_dash_fs") === "1") {
      document.body.className = "fs";
    }
  } catch (e) {}
  try {
    var zs = parseInt(localStorage.getItem("kindle_dash_zoom"), 10);
    if (zs >= 60 && zs <= 200) { applyZoom(zs); }
  } catch (e) {}
  buildGrid();
  tick();
  if (CONFIG.modules.clock && !CONFIG.modules.clock.on) { $("clockBox").innerHTML = ""; }
  cloudPull(function (err, msg) {
    if (err) { showCloud("云端读取失败：" + (err.message || "") + "（编辑仍可用）"); }
    else if (msg) {
      renderCountdown();
      renderTodo();
      showCloud(msg);
    } else {
      var g = CONFIG.github;
      var jb = CONFIG.jsonblob;
      showCloud((g && g.gistId) || (jb && jb.blobId) ? "云端就绪（首次保存后开始同步）" : "云端同步未配置，编辑保存在本机");
    }
  });
}
init();
</script>
