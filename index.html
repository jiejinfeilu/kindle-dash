/* ================================================================
   三、工具函数
   ================================================================ */
function $(id) { return document.getElementById(id); }

function pad(n) { return (n < 10 ? "0" : "") + n; }

function esc(s) {
  return String(s).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
}

function escAttr(s) {
  return esc(s).replace(/"/g, "&quot;");
}

function xhrGet(url, done) {
  var xhr = new XMLHttpRequest();
  xhr.open("GET", url, true);
  xhr.timeout = 12000;
  xhr.onreadystatechange = function () {
    if (xhr.readyState === 4) {
      if (xhr.status >= 200 && xhr.status < 300) { done(null, xhr.responseText); }
      else { done(new Error("HTTP " + xhr.status)); }
    }
  };
  xhr.ontimeout = function () { done(new Error("timeout")); };
  xhr.onerror = function () { done(new Error("network")); };
  xhr.send();
}

function jsonGet(url, done) {
  xhrGet(url, function (err, txt) {
    if (err) { done(err); return; }
    try { done(null, JSON.parse(txt)); }
    catch (e) { done(e); }
  });
}

function proxied(u) { return CONFIG.proxy + encodeURIComponent(u); }

function decodeEntities(s) {
  return s
    .replace(/&amp;/g, "&")
    .replace(/&lt;/g, "<")
    .replace(/&gt;/g, ">")
    .replace(/&quot;/g, "\"")
    .replace(/&#39;/g, "'")
    .replace(/&nbsp;/g, " ");
}

function getPath(obj, path) {
  var parts = path.split(".");
  var cur = obj;
  for (var i = 0; i < parts.length; i++) {
    if (!cur) { return null; }
    cur = cur[parts[i]];
  }
  return cur;
}

function formatNum(n) {
  if (n === undefined || n === null || isNaN(n)) { return "--"; }
  var s = Math.round(n).toString();
  var out = "";
  for (var i = 0; i < s.length; i++) {
    out += s[i];
    var fromRight = s.length - 1 - i;
    if (fromRight > 0 && fromRight % 3 === 0) { out += ","; }
  }
  return out;
}

function setBody(id, html) {
  var el = $("mod-" + id);
  if (el) { el.innerHTML = html; }
}

function panelHtml(title, body) {
  return '<div class="panel"><h2>' + esc(title) + '</h2><div class="p-body">' + body + '</div></div>';
}

/* ================================================================
   四、模块渲染
   ================================================================ */

/* --- 时钟（可爱版） --- */
function renderClock() {
  var now = new Date();
  var h = now.getHours(), m = now.getMinutes(), s = now.getSeconds();
  var week = ["星期日","星期一","星期二","星期三","星期四","星期五","星期六"];
  var greet = h < 6 ? "夜深了，早点休息 ★" :
              h < 12 ? "早上好，元气满满 ☆" :
              h < 18 ? "下午好，继续加油 ☆" : "晚上好，放松一下 ★";
  $("clockBox").innerHTML =
    '<div class="clock-panel">' +
      '<div class="clock-time">' + pad(h) + ':' + pad(m) + '<span class="clock-sec">:' + pad(s) + '</span></div>' +
      '<div class="clock-date">' + now.getFullYear() + '年' + (now.getMonth() + 1) + '月' + now.getDate() + '日 ' + week[now.getDay()] + '</div>' +
      '<div class="clock-greet">' + greet + '</div>' +
    '</div>';
}

/* --- 天气预报：实时 + 未来三天 --- */
function renderWeather() {
  if (CONFIG.weatherApi === "qweather") { renderQWeather(); return; }
  if (CONFIG.weatherApi === "openmeteo") { renderOpenMeteo(); return; }
  renderOpenWeather();
}

function renderOpenWeather() {
  var key = CONFIG.openWeatherKey;
  if (!key) {
    var w = MOCK.weather;
    setBody("weather",
      '<div class="w-main">' + esc(CONFIG.city + " 多云 28°C") + '</div>' +
      '<div class="w-sub">' + esc(w.sub) + '</div>' +
      '<div class="w-fc">' + esc(w.fc.join("\n")) + '</div>' +
      '<div class="tip">（未填 OpenWeather API Key，显示模拟数据）</div>');
    return;
  }
  var q = encodeURIComponent(CONFIG.city);
  var curUrl = "https://api.openweathermap.org/data/2.5/weather?q=" + q + "&appid=" + key + "&units=metric&lang=zh_cn";
  var fcUrl = "https://api.openweathermap.org/data/2.5/forecast?q=" + q + "&appid=" + key + "&units=metric&lang=zh_cn";
  if (CONFIG.openweatherUseProxy) {
    curUrl = proxied(curUrl);
    fcUrl = proxied(fcUrl);
  }
  setBody("weather", '<div class="w-main">加载中…</div><div class="w-fc"></div>');

  jsonGet(curUrl, function (err, d) {
    if (err || !d || !d.main) {
      setBody("weather", '<div class="err">天气加载失败（' + esc(err ? err.message : "无数据") + '），国内网络建议改用和风天气</div>');
      return;
    }
    var desc = (d.weather && d.weather[0]) ? d.weather[0].description : "";
    setBody("weather",
      '<div class="w-main">' + esc(d.name + "  " + desc + "  " + Math.round(d.main.temp) + "°C") + '</div>' +
      '<div class="w-sub">湿度 ' + Math.round(d.main.humidity) + '% ｜ 体感 ' + Math.round(d.main.feels_like) + '°C</div>' +
      '<div class="w-fc" id="fcBody">三天预报加载中…</div>');

    jsonGet(fcUrl, function (err2, d2) {
      var fcEl = $("fcBody");
      if (err2 || !d2 || !d2.list) {
        if (fcEl) { fcEl.textContent = "（三天预报加载失败）"; }
        return;
      }
      var days = {};
      var order = [];
      for (var i = 0; i < d2.list.length; i++) {
        var it = d2.list[i];
        var dt = it.dt_txt.split(" ")[0];
        var dd = days[dt];
        var tmin = it.main.temp_min, tmax = it.main.temp_max;
        var dsc = (it.weather && it.weather[0]) ? it.weather[0].description : "";
        if (!dd) {
          days[dt] = { min: tmin, max: tmax, desc: dsc };
          order.push(dt);
        } else {
          dd.min = Math.min(dd.min, tmin);
          dd.max = Math.max(dd.max, tmax);
          if (!dd.desc && dsc) { dd.desc = dsc; }
        }
      }
      var names = ["今天", "明天", "后天"];
      var lines = [];
      for (var j = 0; j < Math.min(3, order.length); j++) {
        var day = days[order[j]];
        lines.push(names[j] + "：" + (day.desc || "") + " " + Math.round(day.min) + "~" + Math.round(day.max) + "°C");
      }
      if (fcEl) { fcEl.textContent = lines.join("\n"); }
    });
  });
}

function wmoText(code) {
  if (code === 0) { return "晴"; }
  if (code === 1) { return "多云"; }
  if (code === 2 || code === 3) { return "阴"; }
  if (code === 45 || code === 48) { return "雾"; }
  if (code === 51 || code === 53 || code === 55) { return "毛毛雨"; }
  if (code === 56 || code === 57 || code === 66 || code === 67) { return "冻雨"; }
  if (code === 61 || code === 63 || code === 65) { return "雨"; }
  if (code === 71 || code === 73 || code === 75 || code === 77) { return "雪"; }
  if (code === 80 || code === 81 || code === 82) { return "阵雨"; }
  if (code === 85 || code === 86) { return "阵雪"; }
  if (code >= 95) { return "雷雨"; }
  return "未知";
}

function renderOpenMeteo() {
  var url = "https://api.open-meteo.com/v1/forecast?latitude=" + encodeURIComponent(CONFIG.weatherLat) +
            "&longitude=" + encodeURIComponent(CONFIG.weatherLon) +
            "&current_weather=true&daily=weathercode,temperature_2m_max,temperature_2m_min&timezone=auto&forecast_days=3";
  setBody("weather", '<div class="w-main">加载中…</div><div class="w-fc"></div>');
  jsonGet(url, function (err, d) {
    if (err || !d || !d.current_weather) {
      setBody("weather", '<div class="err">天气加载失败（' + esc(err ? err.message : "无数据") + '）</div>');
      return;
    }
    var cw = d.current_weather;
    var main = CONFIG.city + "  " + wmoText(cw.weathercode) + "  " + Math.round(cw.temperature) + "°C";

/* --- 国内内容源 --- */
function parseRss(xmlText) {
  var items = [];
  var re = /<item>([\s\S]*?)<\/item>/g;
  var mm;
  while ((mm = re.exec(xmlText)) !== null) { items.push(mm[1]); }
  var out = [];
  for (var i = 0; i < items.length && out.length < 5; i++) {
    var t = items[i].match(/<title>(.*?)<\/title>/);
    if (t && t[1]) {
      var title = decodeEntities(t[1].replace(/<!\[CDATA\[|\]\]>/g, "")).replace(/\s+/g, " ").trim();
      if (title) { out.push(title); }
    }
  }
  return out;
}

function feedTitles(feed, cb) {
  if (feed.type === "rss") {
    xhrGet(proxied(feed.url), function (err, txt) {
      if (err || !txt) { cb(null, []); return; }
      cb(null, parseRss(txt));
    });
  } else if (feed.type === "json") {
    jsonGet(proxied(feed.url), function (err, data) {
      if (err || !data) { cb(null, []); return; }
      var arr = getPath(data, feed.listPath);
      if (!arr || !arr.length) { cb(null, []); return; }
      var out = [];
      var limit = feed.count || 3;
      for (var i = 0; i < arr.length && out.length < limit; i++) {
        var title = getPath(arr[i], feed.titleKey);
        if (title) { out.push(String(title).trim()); }
      }
      cb(null, out);
    });
  } else {
    cb(null, []);
  }
}

function renderFeeds() {
  var feeds = [];
  for (var i = 0; i < CONFIG.feeds.length; i++) { feeds.push(CONFIG.feeds[i]); }
  if (CONFIG.bilibiliUids && CONFIG.bilibiliUids.length) {
    for (var bi = 0; bi < CONFIG.bilibiliUids.length; bi++) {
      var bu = CONFIG.bilibiliUids[bi];
      feeds.push({ name: bu.name || ("B站UP主 " + bu.uid), type: "rss",
        url: CONFIG.rsshub + "/bilibili/user/dynamic/" + bu.uid, count: 3 });
    }
  }
  if (CONFIG.xiaohongshuRssUrl) {
    feeds.push({ name: "小红书博主", type: "rss", url: CONFIG.xiaohongshuRssUrl, count: 3 });
  }
  if (!feeds.length) {
    setBody("feeds", '<div class="err">请在 CONFIG.feeds 添加内容源</div>');
    return;
  }
  var results = [];
  var done = 0;
  function finishAll() {
    var html = "";
    for (var i = 0; i < feeds.length; i++) {
      var titles = results[i] || [];
      html += '<div class="cat">' + esc(feeds[i].name) + '</div>';
      if (!titles.length) {
        html += '<div class="news-item">（暂无内容或加载失败）</div>';
      } else {
        var limit = Math.min(titles.length, feeds[i].count || 3);
        for (var j = 0; j < limit; j++) {
          html += '<div class="news-item">' + esc(titles[j]) + '</div>';
        }
      }
    }
    setBody("feeds", html);
  }
  for (var k = 0; k < feeds.length; k++) {
    (function (idx) {
      feedTitles(feeds[idx], function (err, titles) {
        results[idx] = titles || [];
        done++;
        if (done >= feeds.length) { finishAll(); }
      });
    })(k);
  }
}

/* --- 股市大盘（腾讯行情接口） --- */
function renderStock() {
  var list = CONFIG.stocks;
  if (!list.length) { setBody("stock", '<div class="err">请在 CONFIG.stocks 添加指数</div>'); return; }
  var codes = [];
  for (var i = 0; i < list.length; i++) { codes.push(list[i].code); }
  var url = proxied("https://qt.gtimg.cn/q=" + codes.join(","));
  xhrGet(url, function (err, txt) {
    if (err || !txt) {
      var mh = "";
      for (var j = 0; j < MOCK.stock.length; j++) {
        mh += '<tr><td>' + esc(MOCK.stock[j].name) + '</td><td class="td-r">' + MOCK.stock[j].price + '</td><td class="td-r">' + MOCK.stock[j].pct + '</td></tr>';
      }
      setBody("stock", '<table class="t">' + mh + '</table><div class="tip">（行情接口加载失败，显示模拟数据）</div>');
      return;
    }
    var html = '<table class="t">';
    var rows = 0;
    for (var k = 0; k < list.length; k++) {
      var s = list[k];
      var mm2 = txt.match(new RegExp("v_" + s.code + '="([^"]*)"'));
      if (!mm2) { continue; }
      var f = mm2[1].split("~");
      var price = parseFloat(f[3]);
      var prev = parseFloat(f[4]);
      if (!isFinite(price) || !isFinite(prev) || !prev) { continue; }
      var pct = (price - prev) / prev * 100;
      var arrow = pct >= 0 ? "↑" : "↓";
      html += '<tr><td>' + esc(s.name) + '</td><td class="td-r">' + price.toFixed(2) + '</td><td class="td-r">' + arrow + ' ' + Math.abs(pct).toFixed(2) + '%</td></tr>';
      rows++;
    }
    html += '</table>';
    if (!rows) { html += '<div class="tip">（未能解析行情，可检查股票代码）</div>'; }
    setBody("stock", html);
  });
}

function daysUntil(dateStr) {
  var target = new Date(dateStr + "T00:00:00");
  var diff = target.getTime() - new Date().getTime();
  return Math.ceil(diff / 86400000);
}

function renderCountdown() {
  var list = loadCountdowns();

    var txt = d > 0 ? "还有 <span class=\"count-days\">" + d + "</span> 天" :
              d === 0 ? "就是今天！" : "已过去 " + (-d) + " 天";
    html += '<div class="count-item">' + esc(list[i].name) + '：' + txt + '</div>';
  }
  setBody("countdown", html);
}

/* --- 多设备同步（jsonblob，无需注册，国内一般可访问） --- */
var JB_KEY = "kindle_dash_jsonblob_id";

function jbId() {
  var c = CONFIG.jsonblob;
  if (c && c.blobId) { return c.blobId; }
  try {
    var s = localStorage.getItem(JB_KEY);
    if (s) { return s; }
  } catch (e) {}
  return "";
}

function jbSaveId(id) {
  try { localStorage.setItem(JB_KEY, id); } catch (e) {}
}

function jbRequest(method, url, body, done) {
  var xhr = new XMLHttpRequest();
  xhr.open(method, url, true);
  if (body) { xhr.setRequestHeader("Content-Type", "application/json"); }
  xhr.timeout = 15000;
  xhr.onreadystatechange = function () {
    if (xhr.readyState === 4) {
      if (xhr.status >= 200 && xhr.status < 300) { done(null, xhr); }
      else { done(new Error("HTTP " + xhr.status)); }
    }
  };
  xhr.ontimeout = function () { done(new Error("timeout")); };
  xhr.onerror = function () { done(new Error("network")); };
  xhr.send(body || null);
}

function jbExtractId(loc) {
  if (!loc) { return ""; }
  var m = loc.match(/([A-Za-z0-9_-]+)\s*$/);
  return m ? m[1] : "";
}

function cloudPush(cb) {
  var body = JSON.stringify({ countdowns: loadCountdowns(), todos: loadTodos() });
  var id = jbId();
  if (id) {
    jbRequest("PUT", "https://jsonblob.com/api/jsonBlob/" + id, body, function (err) {
      if (err) { cb(err); return; }
      cb(null, "已同步云端");
    });
    return;
  }
  jbRequest("PUT", "https://jsonblob.com/api/jsonBlob", body, function (err, xhr) {
    if (err) { cb(err); return; }
    var newId = jbExtractId(xhr.getResponseHeader("Location"));
    if (!newId) { cb(new Error("云端未返回ID")); return; }
    jbSaveId(newId);
    cb(null, "已同步云端（ID: " + newId + "，请填入 jsonblob.blobId 并重新上传，其他设备才能同步）");
  });
}

function cloudPull(cb) {
  var id = jbId();
  if (!id) { cb(null, ""); return; }
  jbRequest("GET", "https://jsonblob.com/api/jsonBlob/" + id, null, function (err, xhr) {
    if (err) { cb(err); return; }
    try {
      var rec = JSON.parse(xhr.responseText);
      if (rec.countdowns && rec.countdowns.length) { saveCountdowns(rec.countdowns); }
      if (rec.todos && rec.todos.length) { saveTodos(rec.todos); }
      cb(null, "已从云端同步");
    } catch (e) { cb(e); }
  });
}

function showCloud(msg) {
  var st = $("cloudStatus");
  if (st) { st.textContent = msg || ""; }
}

  for (var i = 0; i < order.length; i++) {
    var m = CONFIG.modules[order[i]];
    if (m && m.on && order[i] !== "clock") { active.push(order[i]); }
  }
  var html = '<table class="grid">';
  for (var j = 0; j < active.length; j += 2) {
    html += '<tr>';
    html += '<td class="cell">' + renderModule(active[j]) + '</td>';
    if (j + 1 < active.length) {
      html += '<td class="cell">' + renderModule(active[j + 1]) + '</td>';
    } else {
      html += '<td class="cell"></td>';
    }
    html += '</tr>';
  }
  html += '</table>';
  $("grid").innerHTML = html;
  for (var k = 0; k < active.length; k++) { dispatch(active[k]); }
}

/* ================================================================
   六、时钟秒针 + 刷新倒计时 + 30 分钟自动刷新
   ================================================================ */
var START = Date.now();

function tick() {
  if (CONFIG.modules.clock && CONFIG.modules.clock.on) { renderClock(); }
  var remain = CONFIG.refreshMs - ((Date.now() - START) % CONFIG.refreshMs);
  var mm = Math.floor(remain / 60000);
  var ss = Math.floor((remain % 60000) / 1000);
  $("countdown").textContent = pad(mm) + ":" + pad(ss);
}

setInterval(tick, CONFIG.clockMs);

setTimeout(function () {
  var sep = location.href.indexOf("?") >= 0 ? "&" : "?";
  location.href = location.href.split("#")[0] + sep + "v=" + Date.now();
}, CONFIG.refreshMs);

/* ================================================================
   七、初始化
   ================================================================ */
function init() {
  var now = new Date();
  $("lastUpdate").textContent = pad(now.getHours()) + ":" + pad(now.getMinutes());
  var v = $("appVer");
  if (v) { v.textContent = APP_VERSION; }
  buildGrid();
  tick();
  if (CONFIG.modules.clock && !CONFIG.modules.clock.on) { $("clockBox").innerHTML = ""; }
  cloudPull(function (err, msg) {
    if (err) { showCloud("云端同步失败"); }
    else if (msg) {
      renderCountdown();
      renderTodo();
      showCloud(msg);
    }
  });
}
init();
</script>
